version: "3.9"

services:
  swift-app:
    build: .
    container_name: swift-app
    environment:
      BANK_HOST: mock-banks
      APP_HOST: swift-app
      APP_BIND_HOST: 0.0.0.0
      APP_PORT: 3000
      FLASK_DEBUG: "0"
      # Point to eu-bank-system backend when running alongside it on the host:
      EU_BANK_URL: http://host.docker.internal:8080/receive
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      - mock-banks
    restart: unless-stopped

  mock-banks:
    build: .
    container_name: mock-banks
    command: ["sh", "/app/scripts/start_mock_banks.sh"]
    environment:
      MOCK_BIND_HOST: 0.0.0.0
    restart: unless-stopped
